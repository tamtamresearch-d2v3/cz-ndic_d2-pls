perex: 'This document describes the data format used to publish sets of predefined locations – road network sections referenced by messages of other formats (for example traffic status from floating car data or weather station warnings). A referencing message carries only the identifier and version of the location; the full description is in the set: a linear location on a single road described by ALERT-C, OpenLR, Global Network sections and the course in ETRS89 coordinates. A set contains locations of one kind, and a new network release gives the locations a new version. The format is based on the loc:PredefinedLocationsPublication of the DATEX II 3.7 model.'
keywords: DATEX II, NDIC, PredefinedLocationsPublication
