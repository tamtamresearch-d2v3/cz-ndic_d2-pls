# Ruční texty k tabulkám elementů – jediný ručně psaný vstup tabulek.
# Klíč = název třídy ve schématu (např. SituationRecord), pod ním element:
#
# SituationRecord:
#   _: Úvodní věta tabulky (nepovinné).
#   probabilityOfOccurrence:
#     note: Popis z pohledu NDIC.
#     card: "1..1"      # pravidlo NDIC nad rámec schématu (tmavě modře)
#     required: true    # NDIC vždy vyplňuje
#     values:           # překlad/upřesnění hodnot výčtu jen pro tento element
#       certain: jistě nastalo
#   locationReference:
#     variants: reduced # u elementu s více typy: výčet typů je zúžený profilem (popisek „zúžený výčet – N“);
#                       # seznam názvů tříd ([A, B]) uvede jen tyto typy
#
# _enum:                # překlady hodnot výčtů pro celý formát (přepisují sdílený slovník kitu)
#   ProbabilityEnum.certain: jistá
# _unused_types: [LinearLocation]   # třídy, které schéma připouští, ale formát nepoužívá (ve výčtech variant se neuvádějí)

AlertCDirection:
  alertCAffectedDirection:
    ndic: "NDIC uvádí `aligned` pro jednosměrnou polohu (úseky FCD) a `both` pro obousměrnou polohu (úseky meteohlásek); `opposite` se nepoužívá."

PredefinedLocation:
  predefinedLocationName:
    ndic: "Jen je-li název ve zdroji: úseky meteohlásek (název meteohlásky); úseky FCD název nemají."

PredefinedItinerary:
  _: Předdefinovaná trasa – souvislá poloha přes více komunikací (viz Poloha na více komunikacích).
  predefinedLocation:
    card: 2..*
    ndic: "Části trasy, každá na jedné komunikaci, v pořadí jízdy (u obousměrné polohy v pořadí prvního směru); části na sebe navazují."

GmlLineString:
  _: Průběh polohy; uvádí se vždy, lze-li ho vytvořit z geometrie úseků GN.
  posList:
    ndic: "Linie ve směru jízdy od počátku ke konci polohy (u obousměrné polohy v prvním směru). Počátek a konec jsou přesné, mezilehlé body zjednodušené s odchylkou nejvýše 10 m od geometrie úseků GN; alespoň dva body (počátek a konec); souřadnice ETRS89 (`@srsName` = `urn:ogc:def:crs:EPSG::4258`) na 5 desetinných míst (≈ 1 m)."

PercentageDistanceAlongLinearElement:
  percentageDistanceAlong:
    ndic: "Procenta délky úseku 0–100, nejvýše 2 desetinná místa."
SingleRoadLinearLocation:
  alertCLinear:
    card: 0..1
    ndic: "Nejvýše jedna cesta ALERT-C po jedné komunikaci."
