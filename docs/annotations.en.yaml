# Ruční texty k tabulkám elementů – jediný ručně psaný vstup tabulek.
# Klíč = název třídy ve schématu (např. SituationRecord), pod ním element:
#
# SituationRecord:
#   _: Úvodní věta tabulky (nepovinné).
#   probabilityOfOccurrence:
#     note: Popis z pohledu NDIC.
#     card: "1..1"      # pravidlo NDIC nad rámec schématu (tmavě modře)
#     required: true    # NDIC vždy vyplňuje
#     values:           # překlad/upřesnění hodnot výčtu jen pro tento element
#       certain: jistě nastalo
#   locationReference:
#     variants: reduced # u elementu s více typy: výčet typů je zúžený profilem (popisek „zúžený výčet – N“);
#                       # seznam názvů tříd ([A, B]) uvede jen tyto typy
#
# _enum:                # překlady hodnot výčtů pro celý formát (přepisují sdílený slovník kitu)
#   ProbabilityEnum.certain: jistá
# _unused_types: [LinearLocation]   # třídy, které schéma připouští, ale formát nepoužívá (ve výčtech variant se neuvádějí)

AlertCDirection:
  alertCAffectedDirection:
    ndic: "NDIC uses `aligned` for one-directional locations (FCD sections) and `both` for locations valid in both directions (road weather station sections); `opposite` is not used."

PredefinedLocation:
  predefinedLocationName:
    ndic: "Only where the source provides a name: road weather station sections (station name); FCD sections have no name."

PredefinedItinerary:
  _: Predefined itinerary – a contiguous location over several roads (see Itinerary over several roads).
  predefinedLocation:
    card: 2..*
    ndic: "Parts of the itinerary, each on one road, in the order of travel (for a bidirectional location in the order of the first direction); the parts connect."

GmlLineString:
  _: Location path; always given where it can be created from the geometry of the GN sections.
  posList:
    ndic: "Line in the direction of travel from the start to the end of the location (for a bidirectional location in the first direction). The start and end are exact, intermediate points are simplified with a deviation of at most 10 m from the GN section geometry; at least two points (start and end); ETRS89 coordinates (`@srsName` = `urn:ogc:def:crs:EPSG::4258`) to 5 decimal places (≈ 1 m)."

PercentageDistanceAlongLinearElement:
  percentageDistanceAlong:
    ndic: "Percent of the section length 0–100, at most 2 decimal places."
SingleRoadLinearLocation:
  alertCLinear:
    card: 0..1
    ndic: "At most one ALERT-C path along one road."
