perex: 'Tento dokument popisuje datový formát, používaný pro publikaci sad předdefinovaných poloh – úseků silniční sítě, na které odkazují zprávy jiných formátů (například stavové informace z plovoucích vozidel nebo výstrahy meteohlásek). Odkazující zpráva nese jen identifikátor a verzi polohy, úplný popis je v sadě: liniová poloha na jedné komunikaci popsaná metodami ALERT-C, OpenLR, úseky sítě Global Network a průběhem v souřadnicích ETRS89. Sada obsahuje polohy jednoho druhu a s novým vydáním sítě dostávají polohy novou verzi. Formát vychází z publikace loc:PredefinedLocationsPublication modelu DATEX II 3.7.'
keywords: DATEX II, NDIC, PredefinedLocationsPublication
